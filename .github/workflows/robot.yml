name: Robot de vuelos

on:
  schedule:
    # Cada 3 horas, en el minuto 17 (las horas en punto van más saturadas en GitHub).
    # Cada web tiene además su propio intervalo mínimo (+20 min de margen) en la base de datos.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Forzar: revisar ya todas las búsquedas (ignora los intervalos; los bloqueos se respetan siempre)"
        type: boolean
        default: true

# Nunca dos rondas a la vez
concurrency:
  group: robot-vuelos
  cancel-in-progress: false

jobs:
  ronda:
    # No se ejecuta hasta que configures la variable URL_WEB (docs/INSTALACION.md, paso 6):
    # así no gasta minutos ni manda correos de error mientras falta la configuración.
    if: ${{ vars.URL_WEB != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # solo para el paso "Mantener activas las rondas automáticas"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependencias
        run: pip install -r worker/requirements.txt

      - name: Pruebas rápidas
        working-directory: worker
        run: python -m pytest -q tests

      - name: Buscar vuelos
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL_WEB: ${{ vars.URL_WEB }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}
        run: python -m buscador.run

      # En un repositorio público, GitHub desactiva las rondas automáticas tras 60 días sin
      # actividad. Si el último cambio tiene más de 50 días, se sube un commit vacío.
      - name: Mantener activas las rondas automáticas
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Último cambio hace $dias días"
          if [ "$dias" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activas las rondas automáticas del robot"
            git push
          fi
