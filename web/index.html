<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060a17">
  <title>Buscador de Vuelos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/tema.js"></script>
  <!-- Versión fija y con huella (integrity): si alguien alterase el archivo en el CDN, el navegador no lo ejecutaría -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js" integrity="sha384-G436+Z2nlA8+PNoeRvWdxKbvOf8E/y+lYxqht2iBwNHTQDV5CJr3+AGVj8fGZi5t" crossorigin="anonymous" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="sin-sesion">
  <div class="aurora" aria-hidden="true"></div>
  <div class="banda-demo" id="banda-demo" hidden></div>

  <div class="app">
    <aside class="lateral" aria-label="Menú principal">
      <a class="marca" href="#/">
        <span class="marca-logo"><span data-icono="avion"></span></span>
        <span>Buscador de Vuelos<small>Vigila precios por ti</small></span>
      </a>
      <nav class="nav" id="nav-lateral">
        <a href="#/" data-ruta="panel"><span data-icono="panel"></span>Panel</a>
        <a href="#/nueva" data-ruta="nueva"><span data-icono="mas"></span>Nueva búsqueda</a>
        <a href="#/aerolineas" data-ruta="aerolineas"><span data-icono="escudo"></span>Aerolíneas</a>
        <a href="#/estado" data-ruta="estado"><span data-icono="robot"></span>Robot</a>
        <a href="#/perfil" data-ruta="perfil"><span data-icono="usuario"></span>Perfil</a>
      </nav>
      <div class="lateral-pie">
        <div class="estado-robot" id="estado-robot-lateral">
          <span class="punto-vivo apagado"></span><span><b>Robot</b>comprobando…</span>
        </div>
        <div class="fila-botones-pie">
          <button class="fantasma bloque" type="button" data-cambiar-tema><span data-icono="luna"></span>Tema</button>
          <button class="fantasma bloque" type="button" data-salir><span data-icono="salir"></span>Salir</button>
        </div>
      </div>
    </aside>

    <div class="principal">
      <header class="barra-superior">
        <a class="marca" href="#/"><span class="marca-logo"><span data-icono="avion"></span></span><span>Buscador de Vuelos</span></a>
        <div class="acciones-superiores">
          <span class="vivo" id="estado-robot-superior"><span class="punto-vivo apagado"></span></span>
          <button class="icono fantasma" type="button" data-cambiar-tema aria-label="Cambiar tema"><span data-icono="luna"></span></button>
          <button class="icono fantasma" type="button" data-salir aria-label="Salir"><span data-icono="salir"></span></button>
        </div>
      </header>
      <main id="app" class="contenido">
        <div class="cargando-pagina"><div class="anillo"></div></div>
      </main>
    </div>

    <nav class="barra-inferior" id="nav-inferior" aria-label="Menú">
      <a href="#/" data-ruta="panel"><span data-icono="panel"></span>Panel</a>
      <a href="#/estado" data-ruta="estado"><span data-icono="robot"></span>Robot</a>
      <a href="#/nueva" data-ruta="nueva" class="nueva"><span class="burbuja"><span data-icono="mas"></span></span></a>
      <a href="#/aerolineas" data-ruta="aerolineas"><span data-icono="escudo"></span>Aerolíneas</a>
      <a href="#/perfil" data-ruta="perfil"><span data-icono="usuario"></span>Perfil</a>
    </nav>
  </div>
  <div class="notis" id="toasts"></div>
</body>
</html>
